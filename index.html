*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--font);padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:440px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px 20px}
.brand{margin:0 0 12px;font:700 13px/1 Arial,sans-serif;letter-spacing:.08em;color:var(--ghost)}
.prog{margin:0;color:var(--muted);font-size:16px}
h1{margin:2px 0 18px;font-size:29px;line-height:1.45;font-weight:700}
audio{display:block;width:100%;margin:0 0 10px}
.sp{font:inherit;font-size:14px;color:var(--ghost);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;margin-bottom:16px;cursor:pointer}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:19px;padding:13px 12px;border-radius:10px;background:var(--btn);color:var(--btn-fg)}
.btn small{font:400 14px Arial,sans-serif;opacity:.85;margin-left:6px}
.hint{margin:8px 0 20px;color:var(--muted);font-size:14.5px;text-align:center}
.share{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 20px}
.share span{flex-basis:100%;color:var(--muted);font-size:15px}
